services:
  db:
    image: postgres:16-alpine
    container_name: tpms_postgres
    environment:
      POSTGRES_DB: tpms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the backend talks to the database, and 5432 may be in use on the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tpms_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: tpms_backend
    # No published port: nginx (frontend) forwards /api to it, and 8000 may be used by other projects
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/tpms_db
      RATE_LIMIT_STORAGE_URI: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_LOGINS: "true"   # local testing only; the production setup leaves this off
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}   # read from the .env file next to this one
        VITE_OPERATOR_NAME: ${VITE_OPERATOR_NAME:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_CITY: ${VITE_CITY:-}
    container_name: tpms_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
